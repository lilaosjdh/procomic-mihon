name: Build ProComic

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ProComic APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ProComic build kit
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'procomic-github-build-kit*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ProComic ZIP file not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Using: $ZIP_FILE"

          rm -rf kit
          mkdir -p kit

          unzip -q "$ZIP_FILE" -d kit

          echo "Extracted files:"
          find kit -maxdepth 4 -type f | sort

      - name: Locate extension source
        shell: bash
        run: |
          set -e

          EXT_DIR="$(find kit -type d -path '*/src/ar/procomic' -print -quit)"

          if [ -z "$EXT_DIR" ]; then
            echo "ERROR: ProComic extension directory not found."
            find kit -maxdepth 8 -type f | sort
            exit 1
          fi

          echo "Extension directory:"
          echo "$EXT_DIR"

          echo "EXT_DIR=$EXT_DIR" >> "$GITHUB_ENV"

      - name: Checkout Keiyoushi source
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          path: keiyoushi-source

      - name: Install ProComic extension
        shell: bash
        run: |
          set -e

          rm -rf keiyoushi-source/src/ar/procomic

          mkdir -p keiyoushi-source/src/ar/procomic

          cp -r "$EXT_DIR"/. keiyoushi-source/src/ar/procomic/

          echo "Installed ProComic:"
          find keiyoushi-source/src/ar/procomic -maxdepth 10 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build ProComic APK
        working-directory: keiyoushi-source
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :src:ar:procomic:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find keiyoushi-source \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProComic-APK
          path: |
            keiyoushi-source/**/*.apk
          if-no-files-found: error
          retention-days: 7
